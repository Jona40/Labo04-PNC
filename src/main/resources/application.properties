spring.application.name=spring-security-labo

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finanzas_lab}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${SERVER_PORT:8080}

security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY:Zm9vYmFyYmF6cXV4c2VjcmV0a2V5MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
security.jwt.expiration-time=${SECURITY_JWT_EXPIRATION_TIME:3600000}

spring.data.web.pageable.one-indexed-parameters=true

spring.cors.allowed.origins=${CORS_ALLOWED_ORIGINS:*}