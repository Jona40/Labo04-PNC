name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Aquí agregamos el permiso de ejecución necesario para Linux
      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Run Unit Tests
        run: ./mvnw test

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/labo04-app:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/labo04-app:latest